# MySQL + Redis for the end-to-end suites (npm run test:e2e).
#   docker compose -f test/e2e/docker-compose.yml up -d
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: callio
    ports:
      - "33306:3306"
  redis:
    image: redis:7-alpine
    ports:
      - "36379:6379"
