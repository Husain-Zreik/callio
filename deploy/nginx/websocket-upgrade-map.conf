# Shared WebSocket-upgrade map — belongs in the `http {}` context (e.g.
# /etc/nginx/nginx.conf's http block, or anything already included there like
# /etc/nginx/conf.d/*.conf), NOT inside callio.conf's `server {}` block.
# nginx's `map` directive is only valid at http-context level; putting it in
# a sites-available server file is a common mistake that fails to load.
#
# CHECK FIRST: since this server already hosts multiple projects, another
# project may have already defined a map named $connection_upgrade (this is
# the standard, widely-copied nginx WebSocket recipe, so collisions are
# common). Search before adding:
#   grep -r "connection_upgrade" /etc/nginx/
# If it already exists, skip this file entirely and reuse the existing map —
# nginx will fail to reload with a duplicate map name.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
