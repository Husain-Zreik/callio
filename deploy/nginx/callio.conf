# nginx site config for Callio — /etc/nginx/sites-available/callio.conf
# (symlink into sites-enabled as usual).
#
# Two upstream pools, not one, because Callio's PM2 workers share no
# in-memory state (see CLAUDE.md "Process model" / ARCHITECTURE.md): each
# worker owns its own in-process WebRTC peer connections. A request scoped to
# a specific call MUST land on the one worker that actually holds that call's
# objects, or it silently does nothing useful. A brand-new connection with no
# call context yet can go to whichever worker has the most spare capacity.
#
#   callio_call_scoped — consistent-hash on X-Call-ID. Used only for the
#     handful of routes Laravel calls per-call (POST /webhook,
#     POST /internal/calls/release-stale — see src/routes/apiRoutes.js).
#     ASSUMPTION, not yet independently verified from this repo: Laravel
#     sends a literal `X-Call-ID` HTTP header on these calls (documented in
#     CLAUDE.md). If the real header name/casing differs, this silently
#     degrades to "every request hashes to the same one worker" rather than
#     an obvious error — worth confirming against Laravel's actual outgoing
#     request code before trusting this in production.
#
#   callio_general — least_conn. Used for everything else: Socket.IO
#     (agent/browser WebSocket traffic), health checks, and
#     POST /call-center/status (an account-level toggle, not scoped to one
#     live call). Socket.IO connections are long-lived single TCP tunnels —
#     least_conn only decides where a *new* connection lands; once
#     established it naturally stays on that worker for its own lifetime.
#     A client that reconnects after a drop deliberately does NOT need to
#     land back on the same worker — see index.js's own comment on this
#     ("client's built-in reconnect + Nginx least_conn routes the retry to a
#     less-loaded worker") — that's intentional, not something to work
#     around here.
#
# Worker ports: defaults to WORKER_COUNT=2 (BASE_PORT=3001 → 3001,3002), per
# ecosystem.config.cjs's own documented dev/small-server default. Add one
# `server 127.0.0.1:300X;` line per worker to BOTH upstream blocks below if
# this server's .env sets a higher WORKER_COUNT — check with
# `pm2 ls` / this project's own .env on the server, not guessed here.

upstream callio_call_scoped {
    hash $http_x_call_id consistent;
    server 127.0.0.1:3001;
    server 127.0.0.1:3002;
    # server 127.0.0.1:3003;
    # server 127.0.0.1:3004;
}

upstream callio_general {
    least_conn;
    server 127.0.0.1:3001;
    server 127.0.0.1:3002;
    # server 127.0.0.1:3003;
    # server 127.0.0.1:3004;
}

server {
    listen 80;
    listen [::]:80;

    # This file is intentionally HTTP-only: run
    #   certbot --nginx -d callio.pcg-ms.com
    # after this file is enabled and reloaded — certbot rewrites this block
    # to add the HTTPS server + redirect automatically. Hand-authoring the
    # SSL cert paths here would just be guessed values certbot overwrites
    # anyway.
    server_name callio.pcg-ms.com;

    access_log /var/log/nginx/callio.access.log;
    error_log  /var/log/nginx/callio.error.log;

    client_max_body_size 10m;

    # Socket.IO — agent/browser WebSocket traffic. General pool: any worker
    # with capacity, per the reasoning above.
    location /socket.io/ {
        proxy_pass http://callio_general;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade; # from websocket-upgrade-map.conf
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket connections are long-lived — don't let nginx time out an
        # idle-but-open call/agent connection.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Per-call server-to-server routes from Laravel — MUST reach the worker
    # that owns this call's live objects. See upstream block comment above
    # re: the X-Call-ID assumption. Real paths confirmed against index.js
    # (apiRoutes mounted at /api) + src/routes/apiRoutes.js — not root-level.
    location = /api/webhook {
        proxy_pass http://callio_call_scoped;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/internal/calls/release-stale {
        proxy_pass http://callio_call_scoped;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Account-level, not call-scoped — general pool.
    location = /api/call-center/status {
        proxy_pass http://callio_general;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health checks — general pool, plain HTTP proxy, no WebSocket headers needed.
    location = /health {
        proxy_pass http://callio_general;
        proxy_set_header Host $host;
    }

    location = /api/health {
        proxy_pass http://callio_general;
        proxy_set_header Host $host;
    }

    # Everything else Callio serves (currently nothing beyond the routes
    # above plus Socket.IO — see src/routes/apiRoutes.js) falls through here.
    location / {
        proxy_pass http://callio_general;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
