# nginx site for Callio — template for /etc/nginx/sites-available/callio.conf.
# Needs the $connection_upgrade map from websocket-upgrade-map.conf (http context).
#
# No sticky routing: any worker accepts any request or socket. A call's media
# lives on one worker, but call events reach that worker over Redis pub/sub
# (src/infra/redis/RedisPubSubService.js), and Socket.IO's Redis adapter
# delivers room emits from every worker. Sockets are websocket-only, so each
# connection is a single upgraded request that stays on the worker it reached.

# One server per PM2 worker: ports BASE_PORT .. BASE_PORT+WORKER_COUNT-1
# (ecosystem.config.cjs; defaults BASE_PORT=3001, WORKER_COUNT=2).
upstream callio {
    least_conn;
    server 127.0.0.1:3001;
    server 127.0.0.1:3002;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name callio.example.com;

    # TLS — managed by certbot (certbot --nginx -d callio.example.com), which
    # adds lines like these and an HTTP → HTTPS redirect:
    # listen 443 ssl;
    # ssl_certificate     /etc/letsencrypt/live/callio.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/callio.example.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/callio.access.log;
    error_log  /var/log/nginx/callio.error.log;

    # Audio-asset uploads allow 15 MB (src/http/v1/managementRoutes.js).
    client_max_body_size 16m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # Agent gateway (Socket.IO, websocket only). Long timeouts: a socket
    # stays open for an agent's whole session. (A location that sets any
    # proxy_set_header inherits none from the server block, so all are repeated.)
    location /socket.io/ {
        proxy_pass http://callio;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Management API (API key), including /v1/health and
    # /v1/webhooks/whatsapp/forward.
    location /v1/ {
        proxy_pass http://callio;
    }

    # Channel ingress: Meta's webhook (GET verify, POST events).
    location /webhooks/ {
        proxy_pass http://callio;
    }

    location = /health {
        proxy_pass http://callio;
    }

    # Per-worker Prometheus metrics (bearer METRICS_TOKEN). Prometheus scrapes
    # each worker port directly, so this only answers the local host.
    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://callio;
    }

    location / {
        proxy_pass http://callio;
    }
}
