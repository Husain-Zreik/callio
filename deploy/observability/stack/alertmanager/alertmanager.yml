# Alertmanager: receives the server's alerts (every project's Prometheus and Loki
# rules) and sends notifications. Alerts always show in Grafana (Alerting → Alert list,
# data source "Alertmanager") and at 127.0.0.1:9093; to also be notified,
# fill one receiver below and point `route.receiver` at it, then:
#   cd /opt/observability && docker compose restart alertmanager
route:
  receiver: grafana-only
  group_by: [alertname, env]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: grafana-only
      repeat_interval: 1h

receivers:
  # No notification: alerts are visible in Grafana and Alertmanager only.
  - name: grafana-only

