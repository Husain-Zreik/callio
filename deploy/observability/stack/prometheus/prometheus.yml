# Prometheus for the whole server. Projects add their own files:
#   scrape.d/<project>.yml   scrape configs (a list of jobs)
#   rules.d/<project>.yml    alert rules
#   secrets/<name>           bearer tokens those scrapes read
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.d/*.yml

scrape_config_files:
  - /etc/prometheus/scrape.d/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']
