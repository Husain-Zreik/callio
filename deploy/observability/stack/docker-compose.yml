# The server's shared observability stack — one per server, used by every
# project on it. Installed to /opt/observability by install.sh (in the folder
# above); projects plug in their own files there (see README.md):
#
#   alloy/*.alloy                  which log files to ship (base.alloy + one per project)
#   prometheus/scrape.d/*.yml      which /metrics to scrape
#   prometheus/rules.d/*.yml       metric alerts
#   prometheus/secrets/            bearer tokens for the scrapes
#   loki/rules/fake/*.yml          log alerts
#   grafana/dashboards/<Project>/  dashboards, one Grafana folder per project
#
# Host networking, everything on 127.0.0.1: nothing reachable from outside,
# the host firewall untouched. Grafana is published through nginx
# (nginx/grafana.conf).
name: observability

services:
  loki:
    image: grafana/loki:3.4.2
    network_mode: host
    command: ["-config.file=/etc/loki/loki.yml", "-config.expand-env=true"]
    environment:
      LOKI_LISTEN_ADDRESS: 127.0.0.1
      ALERTMANAGER_URL: http://127.0.0.1:9093
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - ./loki/rules:/etc/loki/rules:ro
      - loki-data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.7.5
    network_mode: host
    # A directory: every *.alloy file in it is loaded (base + one per project).
    command: ["run", "/etc/alloy", "--storage.path=/var/lib/alloy/data", "--server.http.listen-addr=127.0.0.1:12345"]
    environment:
      LOKI_PUSH_URL: http://127.0.0.1:3100/loki/api/v1/push
    volumes:
      - ./alloy:/etc/alloy:ro
      # Projects' log files, read-only, at the same paths as on the host.
      - ${PROJECTS_ROOT:-/var/www/html}:/var/www/html:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [loki]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=127.0.0.1:9090
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    network_mode: host
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=127.0.0.1:9093
      - --cluster.listen-address=
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3300"
      # Behind nginx at https://<domain>/grafana/ (nginx/grafana.conf).
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:3300/}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GRAFANA_SUB_PATH:-false}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in /opt/observability/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Logs Drilldown (Explore → Logs): point-and-click log exploration.
      GF_PLUGINS_PREINSTALL: grafana-lokiexplore-app
      PROMETHEUS_URL: http://127.0.0.1:9090
      LOKI_URL: http://127.0.0.1:3100
      ALERTMANAGER_URL: http://127.0.0.1:9093
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [loki, prometheus]
    restart: unless-stopped

volumes:
  loki-data:
  alloy-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
