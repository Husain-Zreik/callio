# The same stack on a development machine with Docker Desktop (no host
# networking). install.sh --local puts it in .observability/ with this file as
# its docker-compose.yml; projects run on the host (Callio: npm run dev).
#   Grafana: http://localhost:3300  (admin / admin)
name: observability-local

services:
  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/loki.yml", "-config.expand-env=true"]
    ports: ["127.0.0.1:3100:3100"]
    environment:
      ALERTMANAGER_URL: http://alertmanager:9093
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - ./loki/rules:/etc/loki/rules:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.7.5
    command: ["run", "/etc/alloy", "--storage.path=/var/lib/alloy/data", "--server.http.listen-addr=0.0.0.0:12345"]
    environment:
      LOKI_PUSH_URL: http://loki:3100/loki/api/v1/push
    ports: ["127.0.0.1:12345:12345"]
    volumes:
      - ./alloy:/etc/alloy:ro
      - ${PROJECTS_ROOT}:/var/www/html:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [loki]

  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--web.enable-lifecycle"]
    ports: ["127.0.0.1:9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager", "--cluster.listen-address="]
    ports: ["127.0.0.1:9093:9093"]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager

  grafana:
    image: grafana/grafana:11.5.2
    ports: ["127.0.0.1:3300:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL: grafana-lokiexplore-app
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      ALERTMANAGER_URL: http://alertmanager:9093
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [loki, prometheus]

volumes:
  loki-data:
  alloy-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
