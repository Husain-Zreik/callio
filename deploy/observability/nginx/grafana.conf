# Grafana at https://<callio domain>/grafana/ through the existing nginx site.
# Include it inside the site's HTTPS server { } block:
#     include /var/www/html/callio/deploy/observability/nginx/grafana.conf;
# and set GRAFANA_ROOT_URL / GRAFANA_SUB_PATH in deploy/observability/.env
# (README.md in this folder).
location /grafana/ {
    proxy_pass http://127.0.0.1:3300;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Grafana Live (dashboard updates) uses a websocket.
location /grafana/api/live/ {
    proxy_pass http://127.0.0.1:3300;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
}
