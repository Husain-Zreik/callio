# Prometheus for a local Callio (docker-compose.local.yml, Docker Desktop):
# `npm run dev` / `npm start` listens on NODE_PORT (3001 by default).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: callio
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ['host.docker.internal:3001', 'host.docker.internal:3901']   # 3901: the e2e runner's Callio
