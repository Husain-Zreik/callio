# Observability for Callio on its server: Loki (logs), Grafana Alloy (ships
# the log files to Loki), Prometheus (metrics from each worker's /metrics),
# Alertmanager (alerts from both), Grafana (dashboards, alerts, log search).
# See README.md in this folder.
#
# Host networking, everything bound to 127.0.0.1: nothing is reachable from
# outside and the host firewall is untouched. Open Grafana through an SSH
# tunnel (ssh -L 3300:127.0.0.1:3300 <server>) or put it behind nginx.
#
#   docker compose -f deploy/observability/docker-compose.yml up -d
name: callio-observability

services:
  loki:
    image: grafana/loki:3.4.2
    network_mode: host
    command: ["-config.file=/etc/loki/loki.yml", "-config.expand-env=true"]
    environment:
      LOKI_LISTEN_ADDRESS: 127.0.0.1
      ALERTMANAGER_URL: http://127.0.0.1:9093
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - ./loki/rules:/etc/loki/rules:ro
      - loki-data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.7.5
    network_mode: host
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data", "--server.http.listen-addr=127.0.0.1:12345"]
    environment:
      LOKI_PUSH_URL: http://127.0.0.1:3100/loki/api/v1/push
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ../../storage/logs/app:/callio-logs:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [loki]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./prometheus/metrics_token:/etc/prometheus/metrics_token:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    network_mode: host
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=127.0.0.1:9093
      - --cluster.listen-address=
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3300"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in deploy/observability/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      PROMETHEUS_URL: http://127.0.0.1:9090
      LOKI_URL: http://127.0.0.1:3100
      ALERTMANAGER_URL: http://127.0.0.1:9093
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [loki, prometheus]
    restart: unless-stopped

volumes:
  loki-data:
  alloy-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
