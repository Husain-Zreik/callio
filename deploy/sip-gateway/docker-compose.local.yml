# Local-machine variant of docker-compose.yml, for testing with a softphone
# instead of the real trunk — NOT used in production. Standalone file rather
# than a compose override, on purpose: `network_mode: host` (used in the real
# docker-compose.yml) doesn't work the same way on Docker Desktop for Windows/
# Mac as it does on Linux, so this uses ordinary port publishing instead.
# Merging that difference via a compose override is more error-prone than
# just keeping two clear, separate files.
#
# Everything is bound to 127.0.0.1 on the host side — only reachable from
# this machine, matching the "same-host" assumption the config files
# (drachtio.local.conf.xml / rtpengine.local.conf) already document, just
# achieved via Docker port publishing instead of a literal network namespace.
#
# RTP range narrowed to 100 ports (30000-30099) — enough for the e2e suite's
# back-to-back calls, keeps the port list short. The production file's wider
# range doesn't need to change.
#
# rtpengine.local.conf (no comments in it: rtpengine's parser rejects them):
#   interface = eth0!127.0.0.1   bind the container's interface (what the
#                                published ports reach), advertise 127.0.0.1
#                                in SDP (how this machine reaches it)
#   delete-delay = 0             free a deleted call's ports at once (default
#                                30 s), so back-to-back test calls don't run out
#
# Usage: docker compose -f docker-compose.local.yml up -d
#        docker compose -f docker-compose.local.yml down
name: callio-sip-local

services:
  drachtio:
    image: drachtio/drachtio-server:latest
    container_name: callio-drachtio-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:5060:5060/udp"
      - "127.0.0.1:5060:5060/tcp"
      - "127.0.0.1:9022:9022/tcp"
    volumes:
      - ./drachtio/drachtio.local.conf.xml:/etc/drachtio.conf.xml:ro
      - drachtio-local-log:/var/log/drachtio
      # The image declares /config as a volume; naming it keeps a recreate
      # from leaving an anonymous volume behind each time.
      - drachtio-local-config:/config

  rtpengine:
    image: drachtio/rtpengine:latest
    container_name: callio-rtpengine-local
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    # Bypasses the image's own /entrypoint.sh entirely. That script
    # unconditionally runs `sed -i` on /etc/rtpengine.conf to substitute a
    # MY_IP placeholder from cloud-provider auto-detection (see $CLOUD in the
    # image's entrypoint.sh) — but `sed -i`'s create-temp-then-rename approach
    # cannot succeed against a single-file bind mount (fails with "Device or
    # resource busy" regardless of read/write mode; this is a Docker
    # limitation, not a permissions issue). Since our config already sets a
    # real interface value directly, we don't need that substitution at all —
    # launching the real binary directly with our own config sidesteps the
    # whole problem.
    entrypoint: ["rtpengine"]
    command: ["--config-file", "/etc/rtpengine.conf"]
    ports:
      - "127.0.0.1:22222:22222/udp"
      - "127.0.0.1:30000-30099:30000-30099/udp"
    volumes:
      - ./rtpengine/rtpengine.local.conf:/etc/rtpengine.conf:ro
      # Same reason as drachtio's /config: the image declares /tmp a volume.
      - rtpengine-local-tmp:/tmp

volumes:
  drachtio-local-log:
  drachtio-local-config:
  rtpengine-local-tmp:
