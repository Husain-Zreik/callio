; Local-testing variant of rtpengine.conf — see docker-compose.local.yml's
; header for why this is a separate file.
;
; interface = 127.0.0.1 is actually CORRECT here, not a placeholder: a
; softphone running on this same Windows machine reaches rtpengine's
; Docker-published ports via 127.0.0.1, so advertising 127.0.0.1 in SDP is
; exactly the right address for this test — unlike the production file,
; where CHANGE_ME_PUBLIC_IP has to be a real public IP for a remote carrier.
;
; listen-ng binds to 0.0.0.0 inside the container for the same Docker
; port-publishing reason explained in drachtio.local.conf.xml.
[rtpengine]
interface = 127.0.0.1
listen-ng = 0.0.0.0:22222
port-min = 30000
port-max = 30010
log-level = 6
log-stderr = true
foreground = true
