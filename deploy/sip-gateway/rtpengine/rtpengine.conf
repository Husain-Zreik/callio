; rtpengine config — RTP relay and WebRTC<->plain-RTP transcoding, controlled
; over its "ng" UDP protocol by whatever connects to listen-ng (Milestone A:
; the validation script in ../test/; Milestone B: Callio's own Node code).
;
; interface: CHANGE_ME. If this host has a real public IP directly on its
; NIC, just use that IP alone. If it's behind a cloud provider's NAT/floating
; IP (AWS/GCP/DigitalOcean etc.), use the "private!public" form so rtpengine
; advertises the externally-reachable address in SDP, not the private one —
; same class of bug as the FreeSWITCH milestone's external-IP note, this is
; the single most common cause of one-way/no audio in any of these stacks.
[rtpengine]
interface = CHANGE_ME_PUBLIC_IP
listen-ng = 127.0.0.1:22222
port-min = 30000
port-max = 30500
log-level = 6
log-stderr = true
foreground = true
