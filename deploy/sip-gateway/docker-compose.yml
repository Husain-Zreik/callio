# drachtio-server + rtpengine — SIP signaling + media relay for the Callio
# SIP trunk integration. Two single-purpose processes instead of FreeSWITCH's
# one monolith: drachtio-server does SIP signaling only (no dialplan, no
# media) and hands control to a Node app (drachtio-srf); rtpengine does RTP
# relay/transcoding (including WebRTC<->plain-RTP), controlled by that same
# Node app over rtpengine's "ng" UDP control protocol.
#
# Images: verify current tags before deploying — written without the ability
# to pull/test images in this environment.
#   - drachtio/drachtio-server is the project's own official image.
#   - rtpengine has no single canonical maintained image the way FreeSWITCH/
#     drachtio do; confirm whichever one you use is current and built from a
#     real rtpengine release, or build from source (github.com/sipwise/rtpengine)
#     if you want more certainty.
#
# host networking for the same reason as any SIP/RTP workload: SDP embeds
# real IPs/ports, and Docker's bridge NAT breaks that unless carefully
# worked around. Firewall rules (see docs/sip.md), not Docker port mappings,
# are what actually restrict access here.
#
# rtpengine.conf's `interface` value: if this host has a real public IP
# directly on its NIC, just use that IP alone. If it's behind a cloud
# provider's NAT/floating IP (AWS/GCP/DigitalOcean etc.), use the
# "private!public" form so rtpengine advertises the externally-reachable
# address in SDP, not the private one — the single most common cause of
# one-way/no audio in any SIP+RTP stack. It names two logical interfaces:
# `external` (the public address, for carriers, Meta and agents' WebRTC) and
# `internal` (127.0.0.1, toward FreeSWITCH). (This note lives here, not in
# rtpengine.conf itself, because that file cannot contain any comment lines
# at all — see the rtpengine service's own comments below for why.)
services:
  drachtio:
    image: drachtio/drachtio-server:latest
    container_name: callio-drachtio
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./drachtio/drachtio.conf.xml:/etc/drachtio.conf.xml:ro
      - drachtio-log:/var/log/drachtio

  rtpengine:
    image: drachtio/rtpengine:latest
    container_name: callio-rtpengine
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    # Bypasses the image's own /entrypoint.sh, confirmed necessary by actually
    # running this image and inspecting its entrypoint.sh directly (not
    # guessed): that script unconditionally runs `sed -i` on /etc/rtpengine.conf
    # to substitute a MY_IP placeholder from cloud-provider auto-detection
    # ($CLOUD env var — gcp/aws/digitalocean/azure). `sed -i`'s
    # create-temp-then-rename approach cannot succeed against a single-file
    # bind mount — fails with "Device or resource busy" regardless of
    # read/write mode; this is a Docker limitation, not a permissions issue.
    # Since our config sets a real interface value directly, we don't need
    # that substitution — launching the real binary bypasses the problem
    # entirely.
    entrypoint: ["rtpengine"]
    command: ["--config-file", "/etc/rtpengine.conf"]
    volumes:
      # rtpengine.conf must have NO comment lines of any kind (no `;`-prefixed
      # lines anywhere in the file) — confirmed by direct testing that its
      # config parser crashes silently (exit 255, zero output) on ANY `;`
      # comment, regardless of position or content. Put explanatory notes in
      # this docker-compose.yml instead, never in rtpengine.conf itself.
      - ./rtpengine/rtpengine.conf:/etc/rtpengine.conf:ro

  # The media server (docs/media-architecture.md): every call is a conference
  # room here. Built from freeswitch/Dockerfile (Opus first, a G.711-only
  # profile for carrier legs, the recording upload script). MEDIA_BIND_IP
  # 127.0.0.1 keeps its SIP profiles (5080, 5082), RTP (10000-19999) and event
  # socket (8021) on loopback: only rtpengine (its `internal` interface),
  # drachtio and Callio on this host talk to it. Its RTP range must not
  # overlap rtpengine's (20000-29999); both stay below Linux's ephemeral ports
  # (32768+), which outgoing connections take. ESL_PASSWORD (in .env) must equal
  # Callio's FREESWITCH_ESL_PASSWORD. FreeSWITCH needs ~15 s to start.
  freeswitch:
    build: ./freeswitch
    image: callio-freeswitch:latest
    container_name: callio-freeswitch
    restart: unless-stopped
    network_mode: host
    cap_add:
      - SYS_NICE
    env_file:
      - .env
    environment:
      MEDIA_BIND_IP: 127.0.0.1
    command: ["freeswitch", "--rtp-range-start", "10000", "--rtp-range-end", "19999"]
    volumes:
      - ./freeswitch/conference.local.conf.xml:/usr/local/freeswitch/conf/autoload_configs/conference.conf.xml:ro

volumes:
  drachtio-log:
